<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#brandGrad)" filter="url(#subtleShadow)" />

  <!-- Inner Soft Highlight Border -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- FixWise Rotating Arrow Emblem (Circular Loop) -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <!-- Curved Arc -->
    <path d="M156 220 A 130 130 0 1 1 180 348" />
    <!-- Arrow Head -->
    <polyline points="156,150 156,224 230,224" />
  </g>

  <!-- Wrench In Center -->
  <g transform="translate(256,256) rotate(45) translate(-256,-256)" fill="#FFFFFF">
    <!-- Wrench Body & Jaws -->
    <path d="M292 220 C284 200 290 176 306 160 C322 144 346 138 366 146 L332 180 L348 196 L382 162 C390 182 384 206 368 222 C352 238 328 244 308 236 L236 308 C230 314 220 314 214 308 L204 298 C198 292 198 282 204 276 Z" />
    <!-- Handle End Loop -->
    <circle cx="210" cy="292" r="6" fill="#047857" />
  </g>
</svg>
